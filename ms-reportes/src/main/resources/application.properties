# Nombre lógico de la aplicación
spring.application.name=ms-reportes

# Puerto del microservicio
server.port=8081

# Conexión a PostgreSQL levantado con Docker
spring.datasource.url=jdbc:postgresql://localhost:5433/reportes_db
spring.datasource.username=valle_user
spring.datasource.password=valle_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect