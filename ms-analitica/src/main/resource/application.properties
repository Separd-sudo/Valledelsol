# Puerto exclusivo de Historial y Analitica
server.port=8085
spring.application.name=ms-analitica

# Configuración de la Base de Datos dedicada (Patrón Database-per-Microservice)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/analitica_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:valle_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:valle_pass}

# Auto-creación de tablas de historial
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Conexión a Apache Kafka
spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.consumer.group-id=valle-sol-analitica-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.valledelsol.ms_analitica.dto