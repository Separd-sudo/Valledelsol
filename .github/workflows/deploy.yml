# Nombre del flujo de trabajo que se mostrará en la pestaña "Actions" de GitHub
name: CI/CD Valle del Sol - Docker Hub

# Definición de disparadores (Triggers)
on:
  push:
    branches:
      - develop # El pipeline se activará automáticamente al hacer 'git push' a esta rama

jobs:
  # Definición del trabajo para compilar y subir las imágenes
  build-and-push:
    name: Compilar y Subir Microservicios
    runs-on: ubuntu-latest
    
    # Estrategia de matriz para procesar los 7 microservicios en paralelo
    strategy:
      matrix:
        service: [bff-valle-sol, ms-reportes, ms-usuarios,  ms-auth, ms-geografico, ms-alertas, ms-analitica] # Lista de carpetas de los microservicios

    steps:
      # Paso 1: Clonar el código del repositorio en la máquina virtual de GitHub actions
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      # Paso 2: Autenticarse en Docker Hub usando las credenciales guardadas en los Secretos de GitHub
      - name: Iniciar Sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Paso 3: Configurar Docker Buildx (Herramienta para optimizar la construcción y manejo de caché)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Paso 4: Compilar el código y subir la imagen construida a Docker Hub
      - name: Construir y Publicar Imagen Docker
        uses: docker/build-push-action@v5
        with:
          # Define el contexto de ejecución apuntando a la carpeta específica del microservicio actual de la matriz
          context: ./${{ matrix.service }}
          # Ruta explícita del Dockerfile a utilizar
          file: ./${{ matrix.service }}/Dockerfile
          # Indica que una vez construida con éxito, la imagen debe subirse (push) inmediatamente a Docker Hub
          push: true
          # Etiquetas (Tags) con las que se guardará la imagen. Reutiliza el nombre de la carpeta como nombre del repositorio Docker
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:develop
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest