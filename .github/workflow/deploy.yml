# ============================================================
# GitHub Actions - Pipeline CI/CD
# Proyecto Valle del Sol
#
# Flujo general:
# 1. Se activa con push a la rama develop.
# 2. Construye las imágenes Docker.
# 3. Publica las imágenes en Docker Hub.
# 5. Actualiza el repositorio y reinicia los contenedores.
# ============================================================
name: Valle del Sol CI/CD

# =====================================================
# EVENTOS QUE ACTIVAN EL PIPELINE
# =====================================================
on:
  push:
    branches:
      - main
      - develop
      - feature/**

  pull_request:
    branches:
      - main

# =====================================================
# JOB PRINCIPAL
# =====================================================
jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # =================================================
      # 1. DESCARGAR CÓDIGO DEL REPOSITORIO
      # =================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =================================================
      # 2. CONFIGURAR JAVA 17
      # =================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =================================================
      # 3. VERIFICAR JAVA
      # =================================================
      - name: Verify Java version
        run: java -version

      # =================================================
      # 4. DAR PERMISOS A MAVEN WRAPPER
      # =================================================
      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      # =================================================
      # 5. COMPILAR PROYECTO SPRING BOOT
      # =================================================
      - name: Build project with Maven
        run: ./mvnw clean package -DskipTests

      # =================================================
      # 6. LOGIN EN DOCKER HUB
      # =================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =================================================
      # 7. CONSTRUIR IMAGEN DOCKER
      # =================================================
      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/valle-del-sol-bff:latest \
          .

      # =================================================
      # 8. SUBIR IMAGEN A DOCKER HUB
      # =================================================
      - name: Push Docker image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/valle-del-sol-bff:latest