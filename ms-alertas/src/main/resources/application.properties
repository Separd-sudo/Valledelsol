# =========================================================
# CONFIGURACIÓN DE SEGURIDAD Y DESERIALIZACIÓN DE KAFKA
# =========================================================

# Puerto exclusivo del servicio
server.port=8084
spring.application.name=ms-alertas

# Coordenada interna del Broker de Kafka en la red Docker
spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.consumer.group-id=valle-sol-alertas-group

# Configuramos el deserializador de confianza para manejar objetos JSON
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Confianza explícita de paquetes para que Spring no bloquee el mapeo del DTO
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.valledelsol.ms_alertas.dto

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5439/alertas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:valle_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:valle_pass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
ms.usuarios.url=${MS_USUARIOS_URL:http://ms-usuarios:8082}