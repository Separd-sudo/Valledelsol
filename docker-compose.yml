# =========================================================
# PROYECTO: VALLE DEL SOL
# Docker Compose principal del sistema FullStack (Producción/Despliegue)
# =========================================================
# Este archivo permite levantar toda la arquitectura utilizando
# las imágenes pre-compiladas y alojadas en Docker Hub,
# eliminando la necesidad de compilar el código en el servidor.
# =========================================================

services:

  #=======================================================
  # SERVICIO DE ZOOKEEPER (Requisito para Kafka)
  #=======================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    ports:
      - "2181:2181" # Puerto estándar de Zookeeper
    networks:
      - valle-network

  #======================================================
  # SERVICIO DE KAFKA (Eje central de la arquitectura EDA)
  #======================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092" # Puerto estándar de Kafka
    networks:
      - valle-network

  # =======================================================
  # BASE DE DATOS - REPORTES
  # =======================================================
  postgres-reportes:
    image: postgres:17
    container_name: postgres-reportes
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_REPORTES}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${PORT_DB_REPORTES}:5432" # Lee el puerto mapeado (5434)
    volumes:
      - postgres_reportes_data:/var/lib/postgresql/data
    networks:
      - valle-network

  # =======================================================
  # BASE DE DATOS - ALERTAS
  # =======================================================
  postgres-alertas:
    image: postgres:17
    container_name: postgres-alertas
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_ALERTAS}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${PORT_DB_ALERTAS}:5432" # Lee el puerto mapeado (5433)
    volumes:
      - postgres_alertas_data:/var/lib/postgresql/data
    networks:
      - valle-network

  # =======================================================
  # BASE DE DATOS - USUARIOS
  # =======================================================
  postgres-usuarios:
    image: postgres:17
    container_name: postgres-usuarios
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_USUARIOS}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${PORT_DB_USUARIOS}:5432" # Lee el puerto mapeado (5433)
    volumes:
      - postgres_usuarios_data:/var/lib/postgresql/data
    networks:
      - valle-network

  # =======================================================
  # BASE DE DATOS - AUTENTICACIÓN
  # =======================================================
  postgres-auth:
    image: postgres:17
    container_name: postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5436:5432" # Mapeamos el puerto externo 5436 seguro
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - valle-network

  # =======================================================
  # BASE DE DATOS - HISTORIAL Y ANALÍTICA
  # =======================================================
  postgres-analitica:
    image: postgres:17
    container_name: postgres-analitica
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_ANALITICA:-analitica_db}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${PORT_DB_ANALITICA:-5437}:5432" # Lee el puerto parametrizado o fallback a 5437
    volumes:
      - postgres_analitica_data:/var/lib/postgresql/data
    networks:
      - valle-network

  # =======================================================
  # BASE DE DATOS - MONITOREO GEOGRÁFICO
  # =======================================================
  postgres-geografico:
    image: postgres:17
    container_name: postgres-geografico
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_GEOGRAFICO:-geografico_db}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${PORT_DB_GEOGRAFICO:-5438}:5432" # Lee el puerto parametrizado o fallback a 5438
    volumes:
      - postgres_geografico_data:/var/lib/postgresql/data
    networks:
      - valle-network

  # =======================================================
  # MICROSERVICIO DE AUTENTICACIÓN (ms-auth)
  # =======================================================
  ms-auth:
    image: separdx/ms-auth:develop
    container_name: ms-auth
    restart: unless-stopped
    depends_on:
      - postgres-auth
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-auth:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    networks:
      - valle-network

  # =======================================================
  # MICROSERVICIO DE ALERTAS
  # =======================================================
  ms-alertas:
   # image: separdx/ms-alertas:develop
    build:
      context: ./ms-alertas     # <--- Apunta a tu carpeta local
      dockerfile: Dockerfile    # <--- Usa tu Dockerfile con Maven
    container_name: ms-alertas
    restart: unless-stopped
    depends_on:
      - postgres-alertas
      - kafka
    ports:
      - "${PORT_MS_ALERTAS}:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:${SPRING_DATASOURCE_URL_ALERTAS}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    networks:
      - valle-network

  # =======================================================
  # MICROSERVICIO DE REPORTES
  # =======================================================
  ms-reportes:
    image: separdx/ms-reportes:develop
    container_name: ms-reportes
    restart: unless-stopped
    depends_on:
      - postgres-reportes
      - kafka
    ports:
      - "${PORT_MS_REPORTES}:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:${SPRING_DATASOURCE_URL_REPORTES}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    networks:
      - valle-network

  # =======================================================
  # MICROSERVICIO DE USUARIOS
  # =======================================================
  ms-usuarios:
    image: separdx/ms-usuarios:develop
    container_name: ms-usuarios
    restart: unless-stopped
    depends_on:
      - postgres-usuarios
    ports:
      - "${PORT_MS_USUARIOS}:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:${SPRING_DATASOURCE_URL_USUARIOS}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    networks:
      - valle-network

  # =======================================================
  # MICROSERVICIO DE HISTORIAL Y ANALÍTICA
  # =======================================================
  ms-analitica:
    #image: separdx/ms-analitica:develop
    build:
      context: ./ms-analitica     # <--- Apunta a tu carpeta local
      dockerfile: Dockerfile    # <--- Usa tu Dockerfile con Maven
    container_name: ms-analitica
    restart: unless-stopped
    depends_on:
      - postgres-analitica
      - kafka
    ports:
      - "${PORT_MS_ANALITICA:-8085}:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-analitica:5432/${DB_NAME_ANALITICA:-analitica_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    networks:
      - valle-network

  # =======================================================
  # MICROSERVICIO DE MONITOREO GEOGRÁFICO
  # =======================================================
  ms-geografico:
    #image: separdx/ms-geografico:develop
    build:
       context: ./ms-geografico     # <--- Apunta a tu carpeta local
       dockerfile: Dockerfile    # <--- Usa tu Dockerfile con Maven
    container_name: ms-geografico
    restart: unless-stopped
    depends_on:
      - postgres-geografico
      - kafka
    ports:
      - "${PORT_MS_GEOGRAFICO:-8086}:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-geografico:5432/${DB_NAME_GEOGRAFICO:-geografico_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    networks:
      - valle-network

  # =======================================================
  # BACKEND FOR FRONTEND (BFF)
  # =======================================================
  bff-valle-sol:
    image: separdx/bff-valle-sol:develop
    container_name: bff-valle-sol
    restart: unless-stopped
    depends_on:
      - ms-reportes
      - ms-usuarios
      - ms-analitica
      - ms-geografico
    ports:
      - "${PORT_BFF}:8080"
    environment:
      - MS_USUARIOS_URL=${MS_USUARIOS_URL}
      - MS_REPORTES_URL=${MS_REPORTES_URL}
      - MS_ANALITICA_URL=http://kong-gateway:8000
      - MS_GEOGRAFICO_URL=http://kong-gateway:8000
    networks:
      - valle-network

  # =======================================================
  # KONG API GATEWAY (Modo DBless)
  # =======================================================
  kong-gateway:
    image: kong:latest
    container_name: kong-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml
    ports:
      - "${PORT_GATEWAY}:8000"
    networks:
      - valle-network
    depends_on:
      - ms-usuarios
      - ms-reportes
      - ms-alertas
      - ms-analitica
      - ms-geografico

# =========================================================
# SECCIÓN GLOBAL DE VOLÚMENES PERSISTENTES
# =========================================================
volumes:
  postgres_reportes_data:
    driver: local
  postgres_usuarios_data:
    driver: local
  postgres_auth_data:
    driver: local
  postgres_alertas_data:
    driver: local
  postgres_analitica_data:
    driver: local
  postgres_geografico_data:
    driver: local

# =========================================================
# RED INTERNA DEL PROYECTO
# =========================================================
networks:
  valle-network:
    driver: bridge