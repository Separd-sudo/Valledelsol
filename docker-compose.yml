# =========================================================
# PROYECTO: VALLE DEL SOL
# Docker Compose principal del sistema FullStack (Producción/Despliegue)
# =========================================================
# Este archivo permite levantar toda la arquitectura utilizando
# las imágenes pre-compiladas y alojadas en Docker Hub,
# eliminando la necesidad de compilar el código en el servidor.
# =========================================================

services:

  # =======================================================
  # BASE DE DATOS - REPORTES
  # =======================================================
  postgres-reportes:
    image: postgres:17
    container_name: postgres-reportes
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_REPORTES}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${PORT_DB_REPORTES}:5432" # Lee el puerto mapeado (5433)
    volumes:
      - postgres_reportes_data:/var/lib/postgresql/data # Almacenamiento seguro de reportes
    networks:
      - valle-network
# =======================================================
# BASE DE DATOS - ALERTAS
# =======================================================
  postgres-alertas:
    image: postgres:17
    container_name: postgres-alertas
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_ALERTAS}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${PORT_DB_ALERTAS}:5432" # Lee el puerto mapeado (5433)
    volumes:
      - postgres_alertas_data:/var/lib/postgresql/data # Almacenamiento seguro de alertas
    networks:
      - valle-network

  # =======================================================
  # BASE DE DATOS - USUARIOS
  # =======================================================
  postgres-usuarios:
    image: postgres:17
    container_name: postgres-usuarios
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_USUARIOS}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${PORT_DB_USUARIOS}:5432"
    volumes:
      - postgres_usuarios_data:/var/lib/postgresql/data # Almacenamiento seguro de usuarios
    networks:
      - valle-network

  # =======================================================
  # BASE DE DATOS - AUTENTICACIÓN
  # =======================================================
  postgres-auth:
    image: postgres:17
    container_name: postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5436:5432"                     # Mapeamos el puerto externo 5436 para no chocar
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data # Almacenamiento seguro de credenciales
    networks:
      - valle-network

  # =======================================================
  # MICROSERVICIO DE AUTENTICACIÓN (ms-auth)
  # =======================================================
  ms-auth:
    image: separdx/ms-auth:develop     # Imagen del repositorio Docker Hub
    container_name: ms-auth
    restart: unless-stopped
    depends_on:
      - postgres-auth
    ports:
      - "8083:8083"                     # Escucha internamente en el puerto 8083
    environment:
      # URL de conexión directa a su base de datos dedicada dentro de la red
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-auth:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    networks:
      - valle-network
  # ======================================================
  # MICROSERVICIO DE ALERTAS
  # =======================================================
  ms-alertas:
    image: separdx/ms-alertas:develop
    container_name: ms-alertas
    restart: unless-stopped
    depends_on:
      - postgres-alertas
    ports:
      - "${PORT_MS_ALERTAS}:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:${SPRING_DATASOURCE_URL_ALERTAS}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    networks:
      - valle-network
  # =======================================================
  # MICROSERVICIO DE REPORTES
  # =======================================================
  ms-reportes:
    image: separdx/ms-reportes:develop
    container_name: ms-reportes
    restart: unless-stopped
    depends_on:
      - postgres-reportes
    ports:
      - "${PORT_MS_REPORTES}:8081"
    # Variables de entorno para que Spring Boot sepa cómo conectarse a la base de datos dentro de la red Docker
    environment:
      - SPRING_DATASOURCE_URL=jdbc:${SPRING_DATASOURCE_URL_REPORTES}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    networks:
      - valle-network

  # =======================================================
  # MICROSERVICIO DE USUARIOS
  # =======================================================
  ms-usuarios:
    image: separdx/ms-usuarios:develop
    container_name: ms-usuarios
    restart: unless-stopped
    depends_on:
      - postgres-usuarios
    ports:
      - "${PORT_MS_USUARIOS}:8082"
    # Variables de entorno para la conexión a la base de datos de usuarios
    environment:
      - SPRING_DATASOURCE_URL=jdbc:${SPRING_DATASOURCE_URL_USUARIOS}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    networks:
      - valle-network

  # =======================================================
  # BACKEND FOR FRONTEND (BFF)
  # =======================================================
  bff-valle-sol:
    image: separdx/bff-valle-sol:develop
    container_name: bff-valle-sol
    restart: unless-stopped
    depends_on:
      - ms-reportes
      - ms-usuarios
    ports:
      - "${PORT_BFF}:8080"
    # Variables de entorno para que el BFF localice los microservicios mediante la red de Docker
    environment:
      - MS_USUARIOS_URL=${MS_USUARIOS_URL}
      - MS_REPORTES_URL=${MS_REPORTES_URL}
    networks:
      - valle-network

  # =======================================================
  # KONG API GATEWAY (Modo DBless - Sin Base de Datos)
  # =======================================================
  kong-gateway:
    image: kong:latest       # Versión liviana y portable de Kong
    container_name: kong-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"               # <-- APAGA LA BASE DE DATOS
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml # Ruta interna en el contenedor
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      # Montamos tu archivo local kong.yml dentro del contenedor en tiempo real
      - ./kong.yml:/usr/local/kong/declarative/kong.yml
    ports:
      - "${PORT_GATEWAY}:8000"           # Tráfico público del sistema (Puerto 8000)
    networks:
      - valle-network
    depends_on:
      - ms-usuarios
      - ms-reportes
      - ms-alertas

# =========================================================
# SECCIÓN GLOBAL DE VOLÚMENES PERSISTENTES (DECLARACIÓN MAVEN/DOCKER)
# =========================================================
# Aquí registramos formalmente los discos duros virtuales que 
# usarán los contenedores de PostgreSQL para no perder datos.
# =========================================================
volumes:
  postgres_reportes_data:
    driver: local                        # Persistencia local para el módulo de incendios
  postgres_usuarios_data:
    driver: local                        # Persistencia local para el módulo de perfiles
  postgres_auth_data:
    driver: local                        # Persistencia local para el módulo de seguridad JWT
  postgres_alertas_data:
    driver: local                        # Persistencia local para el módulo de alertas 
# =========================================================
# RED INTERNA DEL PROYECTO
# =========================================================
networks:
  valle-network:
    driver: bridge                       # Crea el puente de red aislado para el ecosistema