# =========================================================
# CONFIGURACIÓN DECLARATIVA DE KONG (MODO DBLESS)
# MUNICIPALIDAD VALLE DEL SOL
# =========================================================
_format_version: "3.0"
_transform: true

services:
  # -------------------------------------------------------
  # 1. MICROSERVICIO DE USUARIOS
  # -------------------------------------------------------
  - name: usuarios-service
    url: http://ms-usuarios:8082/api/v1/usuarios         # URL interna de la red Docker
    routes:
      - name: usuarios-route-v1
        paths:
          - /api/v1/usuarios             # URL pública versionada
        strip_path: false                # NO recorta el path para evitar el Whitelabel 404

  # -------------------------------------------------------
  # 2. MICROSERVICIO DE REPORTES
  # -------------------------------------------------------
  - name: reportes-service
    url: http://ms-reportes:8081/api/v1/reportes
    routes:
      - name: reportes-route-v1
        paths:
          - /api/v1/reportes             # URL pública versionada
        strip_path: false                # Mantiene la ruta completa hacia Java

  # -------------------------------------------------------
  # 3. MICROSERVICIO DE AUTENTICACIÓN (AUTH MS)
  # -------------------------------------------------------
  - name: auth-service
    url: http://ms-auth:8083/api/v1/auth             # Puerto del microservicio de seguridad
    routes:
      - name: auth-route-v1
        paths:
          - /api/v1/auth                 # El cliente se autenticará directo en el Gateway
        strip_path: false

  # -------------------------------------------------------
  # 4. MICROSERVICIO DE GEOGRAFICO
  # -------------------------------------------------------
  - name: geografico-service
    url: http://ms-geografico:8086/api/v1/geografico         # URL interna de la red Docker
    routes:
      - name: geografico-route-v1
        paths:
          - /api/v1/geografico             # URL pública versionada
        strip_path: false                # Mantiene la ruta completa hacia Java

  # -------------------------------------------------------
  # 5. MICROSERVICIO DE ALERTAS
  # -------------------------------------------------------
  - name: alertas-service
    url: http://ms-alertas:8084/api/v1/alertas        # URL interna de la red Docker
    routes:
      - name: alertas-route-v1
        paths:
          - /api/v1/alertas             # URL pública versionada
        strip_path: false                # Mantiene la ruta completa hacia Java

  # -------------------------------------------------------
  # 6. MICROSERVICIO ANALITICA
  # -------------------------------------------------------
  - name: analitica-service
    url: http://ms-analitica:8085/api/v1/analitica        # URL interna de la red Docker
    routes:
      - name: analitica-route-v1
        paths:
          - /api/v1/analitica             # URL pública versionada
        strip_path: false                # Mantiene la ruta completa hacia Java  

  # -------------------------------------------------------
  # 7. MICROSERVICIO BFF (MUNICIPALIDAD VALLE DEL SOL)
  # -------------------------------------------------------  
  - name: bff-service
    url: http://bff-valle-sol:8080/api/v1/bff         # URL interna de la red Docker
    routes:
      - name: bff-route-v1
        paths:
          - /api/v1/bff             # URL pública versionada
        strip_path: false                # Mantiene la ruta completa hacia Java
        # Inyectamos el plugin aquí para que la ruta resuelva el Preflight (OPTIONS)
        plugins:
          - name: cors
            config:
              origins:
                - http://localhost:3000  # Origen de tu servidor local de Next.js
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Accept-Version
                - Content-Length
                - Content-Type
                - Authorization
              exposed_headers:
                - Authorization
              credentials: true
              max_age: 3600